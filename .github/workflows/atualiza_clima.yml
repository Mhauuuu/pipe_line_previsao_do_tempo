name: Robo do Clima

on:
  schedule:
    
    - cron: '47 9 * * *'
  workflow_dispatch: 


jobs:
  atualizar-dados:
    runs-on: ubuntu-latest 

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Instalar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar o Carteiro e o Pandas
        run: pip install requests pandas

      - name: Rodar o nosso ETL
        run: python clima.py

      - name: Salvar o banco de dados no GitHub
        run: |
          git config --global user.name "Robo Actions"
          git config --global user.email "robo@github.com"
          git add banco_clima.db
          git commit -m "bot: atualiza o banco de dados SQL" || echo "Sem mudanças"
          git push

